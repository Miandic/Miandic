<!DOCTYPE html>
<html lang="en">
<head>

<style>
    html, body { margin: 0; padding: 0; background: #c9d1dd; }
    body { overflow: hidden; height: 100vh; }
    body.m { overflow-x: hidden; overflow-y: auto; height: auto; min-height: 100vh; }
    #bg { position: fixed; inset: 0; z-index: 0; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
    body.m #bg { pointer-events: none; cursor: default; width: 100% !important; height: 100% !important; }
    #sel {
        position: fixed; display: none; pointer-events: none; z-index: 9;
        background-image:
            linear-gradient(90deg, #111 50%, #fff 50%), linear-gradient(90deg, #111 50%, #fff 50%),
            linear-gradient(0deg, #111 50%, #fff 50%), linear-gradient(0deg, #111 50%, #fff 50%);
        background-size: 8px 2px, 8px 2px, 2px 8px, 2px 8px;
        background-position: 0 0, 0 100%, 0 0, 100% 0;
        background-repeat: repeat-x, repeat-x, repeat-y, repeat-y;
        animation: ants .5s linear infinite;
    }
    @keyframes ants { to { background-position: 16px 0, -16px 100%, 0 -16px, 100% 16px; } }

    .stage { position: fixed; left: 50%; top: 50%; width: 880px; height: 652px;
             transform: translate(-50%, -50%); transform-origin: center; z-index: 3; pointer-events: none; }
    .isle { position: absolute; box-sizing: border-box; padding: 15px 19px; overflow: hidden;
            font-family: 'Roboto Mono', ui-monospace, monospace; color: #141a23; will-change: transform; pointer-events: none; }
    .isle a { color: #0e5a70; text-decoration: none; border-bottom: 1px solid rgba(14,90,112,.4); pointer-events: auto; }
    .isle a:hover { color: #06303d; }
    .nm { font-size: 44px; letter-spacing: 3px; margin: 0; font-weight: 500; }
    .rl { font-size: 12.5px; letter-spacing: 2px; text-transform: uppercase; color: #33414f; margin: 9px 0 0; }
    .ct { font-size: 12.5px; letter-spacing: 1px; color: #33414f; margin: 7px 0 0; }
    .isle h2 { font-size: 13.5px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; margin: 0 0 5px; color: #1b2632; }
    .isle p, .isle li { font-size: 13px; line-height: 1.45; margin: 2px 0; color: #222d39; }
    .isle ul { margin: 3px 0; padding-left: 15px; } .isle li { margin: 4px 0; }
    .pj { font-weight: 500; } .tag { color: #5a6675; }
    .hint { position: fixed; right: 16px; bottom: 14px; font-family: ui-monospace, monospace;
            font-size: 10px; letter-spacing: 1px; color: rgba(40,48,60,.45); z-index: 3; }

    body.m #stage { position: relative; left: auto; top: auto; z-index: 3; transform: none !important; width: auto !important; height: auto !important; padding: 10px 0 46px; }
    body.m .isle { position: relative !important; left: auto !important; top: auto !important;
                   width: auto !important; height: auto !important; display: block; margin: 32px 16px; padding: 18px 22px; }
    body.m .nm { font-size: 30px; letter-spacing: 2px; }
    body.m .rl { font-size: 14px; margin-top: 11px; }
    body.m .ct { font-size: 14px; margin-top: 9px; }
    body.m .isle h2 { font-size: 16px; margin-bottom: 7px; }
    body.m .isle p, body.m .isle li { font-size: 15px; line-height: 1.5; }
    body.m .isle ul { padding-left: 18px; } body.m .isle li { margin: 7px 0; }
    body.m .hint { display: none; }

    .pj-item { pointer-events: auto; cursor: pointer; }
    .pj-item:hover .pj { border-bottom: 1px solid rgba(14,90,112,.55); }
    .bubble { position: fixed; z-index: 4; width: 340px; box-sizing: border-box; padding: 20px 22px;
              font-family: 'Roboto Mono', ui-monospace, monospace; color: #141a23; will-change: transform, opacity; }
    .bubble h3 { font-size: 20px; margin: 0 0 4px; font-weight: 500; letter-spacing: 1px; color: #161b24; }
    .bubble .btag { font-size: 12px; color: #5a6675; letter-spacing: 1px; }
    .bubble p { font-size: 13px; line-height: 1.55; color: #222d39; margin: 12px 0; }
    .bubble .bphotos { display: flex; gap: 8px; margin-top: 12px; }
    .bubble .ph { flex: 1; height: 86px; border-radius: 6px; opacity: .9;
                  background: repeating-linear-gradient(45deg, #b4bcc8, #b4bcc8 6px, #9ca5b2 6px, #9ca5b2 12px); }
    .bubble .blinks a { color: #0e5a70; text-decoration: none; border-bottom: 1px solid rgba(14,90,112,.4);
                        font-size: 13px; margin-right: 16px; pointer-events: auto; }
    .bubble .bclose { position: absolute; top: 8px; right: 12px; border: none; background: none; font-size: 22px;
                      line-height: 1; cursor: pointer; color: #44505e; pointer-events: auto; }

    .lang { margin-left: 2px; white-space: nowrap; }
    .lng { cursor: pointer; pointer-events: auto; color: #5a6675; border-bottom: 1px solid transparent; }
    .lng.on { color: #0e5a70; border-bottom: 1px solid rgba(14,90,112,.4); }
    .lng:hover { color: #06303d; }
    .lsep { color: #97a1af; margin: 0 3px; }

    /* Cyrillic falls back to the system monospace, which renders lighter than
       Latin — bump the weight on Russian so the text reads as crisp. */
    html[lang="ru"] .isle p, html[lang="ru"] .isle li,
    html[lang="ru"] .rl, html[lang="ru"] .ct,
    html[lang="ru"] .bubble p, html[lang="ru"] .bubble .btag { font-weight: 500; }

</style>

<script>

const ctx = cv.getContext('2d');
const selBox = document.getElementById('sel');
const stage = document.getElementById('stage');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const SCALE = 4.6;
const DESK = { w: 880, h: 652, p: [[152, 6, 540, 132], [10, 172, 262, 196], [296, 150, 512, 300], [54, 372, 300, 228], [408, 476, 372, 168]] };

let W, H, cell, img, data, base, kScale = 1, STAGEW = 880, STAGEH = 652, isMobile = false;
let balls = [];
let islands = [];
const mouse = { bx: -999, by: -999, mx: -9999, my: -9999, inside: false };
let events = [];
let nextAmbient = performance.now() + 3500;
let last = performance.now();
let lastScrollY = 0, fieldH = 0, scrollCell = 0, scrollVel = 0;
const visBalls = [];

const sel = { active: false, sx: 0, sy: 0, cx: 0, cy: 0 };

let bubble = null, bubbleIsland = null, bubbleIdx = -1;
let recoilX = 0, recoilY = 0, recoilVX = 0, recoilVY = 0;

const T = {
    en: {
        nm: 'Michael Andreev',
        role: 'MIANDIC — software & robotics engineer',
        loc: 'Russia',
        h_about: 'About', h_projects: 'Projects', h_skills: 'Skills', h_ach: 'Achievements',
        about: a => 'Hi! My name is Michael, I am ' + a + ' years old, I am a developer and an engineer. I create autonomous robots, bionics, intuitive control systems, and AI.',
        sk: ['Programming: C++, Python, JS / TS, Rust',
             'Engineering: Autodesk Inventor, ROS, Raspberry Pi, NVIDIA Jetson, Arduino, CNC, 3D printing, soldering',
             'Languages: Russian (native), English (B2)'],
        ach: ['Prize winner — National Technical Olympiad, intelligent robotic systems',
              'Winner — regional & all-Russian stages of ШУСТРИК'],
        hint: 'hover · drag to select',
        short: [
            ['EMG Wristband', 'AI · Embedded ↗', 'Forearm EMG band decoding hand motion in real time. UMNIK 2026 grant.'],
            ['Biomimetic Hand', '3D · C++ ↗', 'Hand driven by hydraulic muscles. Active WIP.'],
            ['Drone Battery Change', 'C++ ↗', 'Autonomous battery-swap system. ШУСТРИК winner.'],
            ['Multisig dApp', 'JS ↗', 'UI for multi-signature TON wallets.']
        ],
        proj: [
            { title: 'EMG Wristband', tags: 'AI · Embedded · Grant', photos: 2, links: [],
              body: 'A wearable 6-channel forearm EMG band (ADS1293 ×2, ESP32-S3, BLE 5.0) paired with a causal transformer that continuously decodes ≥15 hand joint angles in real time — not discrete gestures. It sits on the proximal forearm, so it stays compatible with an amputation stump. Dual use: teleoperating collaborative robots and driving bionic prostheses. UMNIK 2026 grant project.' },
            { title: 'Biomimetic Hand', tags: '3D · C++ · Active WIP', photos: 2, links: [],
              body: 'A robotic hand actuated by hydraulic artificial muscles. Initially inspired by the human hand, evolving with whatever the hardware allows. Active work in progress.' },
            { title: 'Drone Battery Change', tags: 'C++ · Hardware', photos: 2,
              links: [{ t: 'Competition →', u: 'https://shustrik.org/blog/880214' }],
              body: 'An autonomous drone battery-swap system. Winner of the ШУСТРИК competition in the Aerospace section; redesigned in 2024 into a more serious prototype.' },
            { title: 'Multisig dApp', tags: 'JS · Web', photos: 1,
              links: [{ t: 'GitHub →', u: 'https://github.com/Gusarich/multisig-dapp' }],
              body: 'A user-friendly web interface for interacting with multi-signature wallets on TON.' }
        ]
    },
    ru: {
        nm: 'Михаил Андреев',
        role: 'MIANDIC — инженер ПО и робототехники',
        loc: 'Россия',
        h_about: 'Обо мне', h_projects: 'Проекты', h_skills: 'Навыки', h_ach: 'Достижения',
        about: a => 'Привет! Меня зовут Михаил, мне ' + a + ', я разработчик и инженер. Создаю автономных роботов, бионику, интуитивные системы управления и ИИ.',
        sk: ['Программирование: C++, Python, JS / TS, Rust',
             'Инженерия: Autodesk Inventor, ROS, Raspberry Pi, NVIDIA Jetson, Arduino, ЧПУ, 3D-печать, пайка',
             'Языки: русский (родной), английский (B2)'],
        ach: ['Призёр — Национальная технологическая олимпиада, интеллектуальные робототехнические системы',
              'Победитель — региональный и всероссийский этапы ШУСТРИК'],
        hint: 'наведи · выдели мышкой',
        short: [
            ['ЭМГ-браслет', 'ИИ · Embedded ↗', 'Браслет ЭМГ на предплечье — распознаёт движения кисти в реальном времени. Грант УМНИК 2026.'],
            ['Биомиметическая рука', '3D · C++ ↗', 'Кисть на гидравлических мышцах. Активная разработка.'],
            ['Замена батарей дрона', 'C++ ↗', 'Автономная замена аккумуляторов. Победитель ШУСТРИК.'],
            ['Multisig dApp', 'JS ↗', 'Интерфейс для мультиподписных кошельков TON.']
        ],
        proj: [
            { title: 'ЭМГ-браслет', tags: 'ИИ · Embedded · Грант', photos: 2, links: [],
              body: 'Носимый 6-канальный ЭМГ-браслет на предплечье (ADS1293 ×2, ESP32-S3, BLE 5.0) в связке с каузальным трансформером, который непрерывно оценивает ≥15 суставных углов кисти в реальном времени — не дискретные жесты. Размещается на проксимальном предплечье и остаётся совместим с культёй при ампутации. Двойное применение: телеоперация коллаборативными роботами и управление бионическими протезами. Проект гранта УМНИК 2026.' },
            { title: 'Биомиметическая рука', tags: '3D · C++ · Активная разработка', photos: 2, links: [],
              body: 'Роботизированная кисть на гидравлических искусственных мышцах. Изначально вдохновлена человеческой рукой, развивается в меру возможностей железа. Активная разработка.' },
            { title: 'Замена батарей дрона', tags: 'C++ · Железо', photos: 2,
              links: [{ t: 'Конкурс →', u: 'https://shustrik.org/blog/880214' }],
              body: 'Автономная система замены аккумуляторов дрона. Победитель конкурса ШУСТРИК в аэрокосмической секции; в 2024 переработана в более серьёзный прототип.' },
            { title: 'Multisig dApp', tags: 'JS · Веб', photos: 1,
              links: [{ t: 'GitHub →', u: 'https://github.com/Gusarich/multisig-dapp' }],
              body: 'Удобный веб-интерфейс для работы с мультиподписными кошельками на TON.' }
        ]
    }
};

let lang = localStorage.getItem('lang');
if (lang !== 'en' && lang !== 'ru') lang = (navigator.language || '').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en';
let PROJECTS = T[lang].proj;

function ageNow() {
    const d = new Date();
    let age = d.getFullYear() - 2005;
    const m = d.getMonth() + 1;
    if (m < 9 || (m === 9 && d.getDate() < 20)) age--;
    return age;
}

function ruAge(n) {
    const d10 = n % 10, d100 = n % 100;
    if (d10 === 1 && d100 !== 11) return n + ' год';
    if (d10 >= 2 && d10 <= 4 && (d100 < 10 || d100 >= 20)) return n + ' года';
    return n + ' лет';
}

function applyLang(l, relayout) {
    lang = l;
    try { localStorage.setItem('lang', l); } catch (e) {}
    document.documentElement.lang = l;
    const t = T[l];
    document.getElementById('nm').textContent = t.nm;
    document.getElementById('role').textContent = t.role;
    document.getElementById('loc').textContent = t.loc;
    document.getElementById('h-about').textContent = t.h_about;
    document.getElementById('h-projects').textContent = t.h_projects;
    document.getElementById('h-skills').textContent = t.h_skills;
    document.getElementById('h-ach').textContent = t.h_ach;
    document.getElementById('about').textContent = t.about(l === 'ru' ? ruAge(ageNow()) : ageNow());
    for (let i = 0; i < 3; i++) document.getElementById('sk' + i).textContent = t.sk[i];
    for (let i = 0; i < 2; i++) document.getElementById('ac' + i).textContent = t.ach[i];
    document.getElementById('hint').textContent = t.hint;
    document.querySelectorAll('.pj-item').forEach(function (el) {
        const s = t.short[+el.dataset.idx];
        el.querySelector('.pj').textContent = s[0];
        el.querySelector('.tag').textContent = s[1];
        el.querySelector('.pd').textContent = s[2];
    });
    PROJECTS = t.proj;
    document.querySelectorAll('.lng').forEach(function (a) { a.classList.toggle('on', a.dataset.l === l); });
    closeBubble(true);
    if (relayout) {
        applyLayout(); setStageScale(); updateIslands();
        if (isMobile) {
            const shc = H / window.innerHeight;
            fieldH = Math.max(window.innerHeight, document.documentElement.scrollHeight || window.innerHeight) * shc;
        }
    }
}

function initBalls() {
    balls = [];
    const screens = Math.max(1, fieldH / H);
    const n = Math.min(30, Math.round((5 + Math.random() * 3) * screens));
    for (let i = 0; i < n; i++) {
        balls.push({
            ox: 0.1 * W + Math.random() * 0.8 * W, oy: 0.03 * fieldH + Math.random() * 0.94 * fieldH,
            rx: 0.05 * W + Math.random() * 0.12 * W, ry: 0.04 * H + Math.random() * 0.09 * H,
            sx: 0.0006 + Math.random() * 0.0010, sy: 0.0006 + Math.random() * 0.0010,
            ax: Math.random() * 6.3, ay: Math.random() * 6.3,
            r: 0.05 * W + Math.random() * 0.04 * W, x: 0, y: 0
        });
    }
}

function applyLayout() {
    isMobile = window.innerWidth < 720;
    document.body.classList.toggle('m', isMobile);
    const els = document.querySelectorAll('.isle');
    if (isMobile) {
        stage.style.width = ''; stage.style.height = '';
        for (const el of els) { el.style.left = ''; el.style.top = ''; el.style.width = ''; el.style.height = ''; el.style.transform = ''; }
    } else {
        STAGEW = DESK.w; STAGEH = DESK.h;
        stage.style.width = DESK.w + 'px'; stage.style.height = DESK.h + 'px';
        for (let i = 0; i < els.length; i++) {
            const a = DESK.p[i];
            els[i].style.left = a[0] + 'px'; els[i].style.top = a[1] + 'px';
            els[i].style.width = a[2] + 'px'; els[i].style.height = a[3] + 'px';
        }
    }
}

function setStageScale() {
    if (isMobile) { kScale = 1; return; }
    kScale = Math.min(1, (window.innerWidth - 40) / STAGEW, (window.innerHeight - 40) / STAGEH);
    stage.style.transform = 'translate(-50%, -50%) scale(' + kScale + ')';
}

function updateIslands() {
    const sw = W / window.innerWidth, sh = H / window.innerHeight, out = 8;
    islands = [];
    document.querySelectorAll('.isle').forEach(el => {
        el.style.transform = '';
        const rc = el.getBoundingClientRect();
        islands.push({
            el, sw, sh,
            bcx: rc.left + rc.width / 2, bcy: rc.top + rc.height / 2,
            docx: rc.left + rc.width / 2 + (window.scrollX || 0), docy: rc.top + rc.height / 2 + (window.scrollY || 0),
            w2: rc.width / 2, h2: rc.height / 2,
            hx: (rc.width / 2 + out) * sw, hy: (rc.height / 2 + out) * sh, r: 14 * sw,
            ampx: 7 + Math.random() * 5, ampy: 6 + Math.random() * 5,
            spx: 0.0004 + Math.random() * 0.0004, spy: 0.0004 + Math.random() * 0.0004,
            phx: Math.random() * 6.3, phy: Math.random() * 6.3,
            gspeed: 0.00018 + Math.random() * 0.00016, gphase: Math.random() * 6.3,
            curx: 0, cury: 0, slosh: 0, sloshK: 0.5 + Math.random() * 0.5, gcos: 1, gsin: 0, cx: 0, cy: 0, L: 0, R: 0, T: 0, B: 0
        });
    });
}

function driftIslands(t) {
    if (isMobile) {
        const sw = W / window.innerWidth, sh = H / window.innerHeight;
        const maxS = Math.max(0, (document.documentElement.scrollHeight || 0) - window.innerHeight);
        let sy = window.scrollY || window.pageYOffset || 0;
        if (sy < 0) sy = 0; else if (sy > maxS) sy = maxS;
        let sd = sy - lastScrollY; lastScrollY = sy;
        if (sd > 80) sd = 80; else if (sd < -80) sd = -80;
        scrollVel = scrollVel * 0.82 + sd * 0.18;
        if (scrollVel > -0.05 && scrollVel < 0.05) scrollVel = 0;
        scrollCell = sy * sh;
        for (let n = 0; n < islands.length; n++) {
            const o = islands[n];
            const tx = o.ampx * Math.sin(t * o.spx + o.phx), ty = o.ampy * Math.sin(t * o.spy + o.phy);
            o.curx += (tx - o.curx) * 0.04; o.cury += (ty - o.cury) * 0.04;
            const target = scrollVel * o.sloshK * 1.4;
            o.slosh += (target - o.slosh) * 0.2;
            if (o.slosh > 28) o.slosh = 28; else if (o.slosh < -28) o.slosh = -28;
            const totY = o.cury + o.slosh;
            // Screen position derived from cached document coords + known scroll (no per-frame reflow).
            o.cx = (o.docx + o.curx) * sw; o.cy = (o.docy - sy + totY) * sh;
            o.hx = (o.w2 + 8) * sw; o.hy = (o.h2 + 8) * sh; o.r = 14 * sw;
            o.L = o.cx - o.hx; o.R = o.cx + o.hx; o.T = o.cy - o.hy; o.B = o.cy + o.hy;
            const gp = t * o.gspeed + o.gphase; o.gcos = Math.cos(gp); o.gsin = Math.sin(gp);
            o.el.style.transform = 'translate(' + o.curx + 'px,' + totY + 'px)';
        }
        return;
    }
    recoilVX += -recoilX * 0.07; recoilVX *= 0.84; recoilX += recoilVX;
    recoilVY += -recoilY * 0.07; recoilVY *= 0.84; recoilY += recoilVY;
    const sw = W / window.innerWidth, sh = H / window.innerHeight;
    const bpx = bubbleIsland ? bubbleIsland.cx / sw : 0, bpy = bubbleIsland ? bubbleIsland.cy / sh : 0;
    const R = 200, maxPull = 10;
    for (let n = 0; n < islands.length; n++) {
        const o = islands[n];
        if (o.track) {
            measureFromRect(o);
            const gpt = t * o.gspeed + o.gphase; o.gcos = Math.cos(gpt); o.gsin = Math.sin(gpt);
            continue;
        }
        let tx = o.ampx * Math.sin(t * o.spx + o.phx);
        let ty = o.ampy * Math.sin(t * o.spy + o.phy);
        if (mouse.inside) {
            const vx = mouse.mx - (o.bcx + tx), vy = mouse.my - (o.bcy + ty);
            const d2 = vx * vx + vy * vy;
            if (d2 < R * R) {
                const d = Math.sqrt(d2) || 1;
                const pull = maxPull * (1 - d / R) * Math.min(d / 45, 1);
                tx += vx / d * pull; ty += vy / d * pull;
            }
        }
        if (bubbleIsland) {
            const rx2 = o.bcx - bpx, ry2 = o.bcy - bpy;
            const rd = Math.sqrt(rx2 * rx2 + ry2 * ry2) || 1;
            if (rd < 340) { const push = 115 * (1 - rd / 340); tx += rx2 / rd * push; ty += ry2 / rd * push; }
        }
        o.curx += (tx - o.curx) * 0.035; o.cury += (ty - o.cury) * 0.035;
        const ox = o.curx + recoilX, oy = o.cury + recoilY;
        o.cx = (o.bcx + ox) * o.sw; o.cy = (o.bcy + oy) * o.sh;
        o.L = o.cx - o.hx; o.R = o.cx + o.hx; o.T = o.cy - o.hy; o.B = o.cy + o.hy;
        const gp = t * o.gspeed + o.gphase;
        o.gcos = Math.cos(gp); o.gsin = Math.sin(gp);
        o.el.style.transform = 'translate(' + (ox / kScale) + 'px,' + (oy / kScale) + 'px)';
    }
}

function measureFromRect(o) {
    const sw = W / window.innerWidth, sh = H / window.innerHeight;
    const rc = o.el.getBoundingClientRect();
    o.cx = (rc.left + rc.width / 2) * sw; o.cy = (rc.top + rc.height / 2) * sh;
    o.hx = (rc.width / 2 + 8) * sw; o.hy = (rc.height / 2 + 8) * sh; o.r = 14 * sw;
    o.L = o.cx - o.hx; o.R = o.cx + o.hx; o.T = o.cy - o.hy; o.B = o.cy + o.hy;
}

function resize() {
    closeBubble(true);
    recoilX = recoilY = recoilVX = recoilVY = 0;
    const cw = window.innerWidth, ch = window.innerHeight;
    cell = Math.max(4, Math.round(cw / 480));
    W = Math.max(100, Math.round(cw / cell));
    H = Math.max(60, Math.round(ch / cell));
    cv.width = W; cv.height = H;
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    img = ctx.createImageData(W, H);
    data = img.data;
    base = new Uint8ClampedArray(W * H * 4);
    events = [];
    applyLayout();
    setStageScale();
    updateIslands();
    const shc = H / ch;
    fieldH = isMobile ? Math.max(ch, document.documentElement.scrollHeight || ch) * shc : H;
    lastScrollY = isMobile ? (window.scrollY || 0) : 0;
    scrollCell = lastScrollY * shc;
    initBalls();
}

function islandField(x, y) {
    let v = 0;
    for (let n = 0; n < islands.length; n++) {
        const o = islands[n];
        if (x < o.L - 34 || x > o.R + 34 || y < o.T - 34 || y > o.B + 34) continue;
        const dx = x - o.cx, dy = y - o.cy;
        const qx = Math.abs(dx) - o.hx + o.r, qy = Math.abs(dy) - o.hy + o.r;
        const ox = Math.max(qx, 0), oy = Math.max(qy, 0);
        const sd = Math.sqrt(ox * ox + oy * oy) + Math.min(Math.max(qx, qy), 0) - o.r;
        let gg = dx / o.hx * o.gcos + dy / o.hy * o.gsin;
        gg = gg > 1 ? 1 : gg < -1 ? -1 : gg;
        const reach = SCALE * (1 + (gg > 0 ? 0.20 : 0.35) * gg);
        v += 0.9 * Math.exp(-sd / reach);
    }
    return v > 6 ? 6 : v;
}

function computeBase(t) {
    visBalls.length = 0;
    for (let b = 0; b < balls.length; b++) {
        const o = balls[b];
        o.x = o.ox + Math.cos(t * o.sx + o.ax) * o.rx;
        const sy = o.oy + Math.sin(t * o.sy + o.ay) * o.ry - scrollCell;
        if (sy > -42 && sy < H + 42) visBalls.push({ x: o.x, y: sy, r2: o.r * o.r });
    }
    if (bubbleIsland && islands.length > 2) {
        const a = islands[2], b = bubbleIsland;
        const ddx = b.cx - a.cx, ddy = b.cy - a.cy;
        const n = Math.max(6, Math.round(Math.sqrt(ddx * ddx + ddy * ddy) / 11));
        for (let i = 1; i <= n; i++) {
            const f = i / (n + 1);
            visBalls.push({ x: a.cx + ddx * f, y: a.cy + ddy * f, r2: 56 - 22 * f });
        }
    }
    let p = 0;
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            let f = islandField(x, y);
            for (let b = 0; b < visBalls.length; b++) {
                const vb = visBalls[b];
                const dx = x - vb.x, dy = y - vb.y;
                f += vb.r2 / (dx * dx + dy * dy + 1);
            }
            let r, g, bl;
            if (f > 1.0) {
                const m = Math.min((f - 1) * 0.7, 1);
                const edge = 1 - Math.min(Math.abs(f - 1.0) * 1.4, 1);
                const s = 66 + m * 150;
                r = s; g = s + m * 6; bl = s + m * 22;
                r += edge * 120 * Math.max(0, Math.sin(t * 0.0014 + y * 0.12));
                bl += edge * 150 * Math.max(0, Math.cos(t * 0.0011 + x * 0.12));
                g += edge * 64 * Math.max(0, Math.sin(t * 0.0009 + x * 0.1));
            } else {
                const pl = Math.sin(x * 0.035 + t * 0.0010) + Math.sin(y * 0.05 - t * 0.0008)
                         + Math.sin((x + y) * 0.025 + t * 0.0006);
                const q = Math.floor(((pl + 3) / 6) * 5) / 5;
                r = 150 + q * 78; g = 158 + q * 74; bl = 172 + q * 70;
                if (((x + y + (t * 0.05 | 0)) & 7) === 0) { r += 6; g += 6; bl += 9; }
            }
            if (mouse.inside && !isMobile) {
                const dmx = x - mouse.bx, dmy = y - mouse.by;
                const glow = 60 * Math.exp(-(dmx * dmx + dmy * dmy) / 260);
                r += glow; g += glow; bl += glow * 1.1;
            }
            base[p++] = r; base[p++] = g; base[p++] = bl; base[p++] = 255;
        }
    }
}

function lum(a, i) { return 0.299 * a[i] + 0.587 * a[i + 1] + 0.114 * a[i + 2]; }

function computeSlots(ev) {
    const { w, h, buf, slot, axis, asc } = ev;
    if (axis === 'v') {
        for (let c = 0; c < w; c++) {
            const rows = [];
            for (let r = 0; r < h; r++) rows.push(r);
            rows.sort((A, B) => asc ? lum(buf, (A * w + c) * 4) - lum(buf, (B * w + c) * 4) : lum(buf, (B * w + c) * 4) - lum(buf, (A * w + c) * 4));
            for (let k = 0; k < h; k++) slot[rows[k] * w + c] = k;
        }
    } else {
        for (let r = 0; r < h; r++) {
            const cols = [];
            for (let c = 0; c < w; c++) cols.push(c);
            cols.sort((A, B) => asc ? lum(buf, (r * w + A) * 4) - lum(buf, (r * w + B) * 4) : lum(buf, (r * w + B) * 4) - lum(buf, (r * w + A) * 4));
            for (let k = 0; k < w; k++) slot[r * w + cols[k]] = k;
        }
    }
}

function buildEvent(ax0, ay0, ax1, ay1, opts) {
    opts = opts || {};
    const x0 = clamp(Math.min(ax0, ax1), 0, W - 1), y0 = clamp(Math.min(ay0, ay1), 0, H - 1);
    const x1 = clamp(Math.max(ax0, ax1), 0, W - 1), y1 = clamp(Math.max(ay0, ay1), 0, H - 1);
    const w = x1 - x0 + 1, h = y1 - y0 + 1;
    if (w < 5 || h < 5) return null;
    const ev = {
        x0, y0, w, h,
        axis: opts.axis || (Math.random() < 0.5 ? 'v' : 'h'),
        asc: opts.asc != null ? opts.asc : Math.random() < 0.5,
        buf: new Uint8ClampedArray(w * h * 4), slot: new Int16Array(w * h),
        phase: opts.impact ? 'impact' : 'sorting',
        impactUntil: (opts.now || performance.now()) + 130,
        parity: 0, noSwap: 0, holdUntil: 0, remix: 0
    };
    for (let ly = 0; ly < h; ly++)
        for (let lx = 0; lx < w; lx++) {
            const s = ((y0 + ly) * W + (x0 + lx)) * 4, d = (ly * w + lx) * 4;
            ev.buf[d] = base[s]; ev.buf[d + 1] = base[s + 1]; ev.buf[d + 2] = base[s + 2]; ev.buf[d + 3] = 255;
        }
    computeSlots(ev);
    events.push(ev);
    return ev;
}

function onePass(ev) {
    const { w, h, buf, slot, axis, parity } = ev;
    let swapped = false;
    if (axis === 'v') {
        for (let c = 0; c < w; c++)
            for (let r = parity; r + 1 < h; r += 2) {
                const i = r * w + c, j = (r + 1) * w + c;
                if (slot[i] > slot[j]) {
                    const ts = slot[i]; slot[i] = slot[j]; slot[j] = ts;
                    const bi = i * 4, bj = j * 4;
                    for (let k = 0; k < 3; k++) { const t = buf[bi + k]; buf[bi + k] = buf[bj + k]; buf[bj + k] = t; }
                    swapped = true;
                }
            }
    } else {
        for (let r = 0; r < h; r++)
            for (let c = parity; c + 1 < w; c += 2) {
                const i = r * w + c, j = r * w + c + 1;
                if (slot[i] > slot[j]) {
                    const ts = slot[i]; slot[i] = slot[j]; slot[j] = ts;
                    const bi = i * 4, bj = j * 4;
                    for (let k = 0; k < 3; k++) { const t = buf[bi + k]; buf[bi + k] = buf[bj + k]; buf[bj + k] = t; }
                    swapped = true;
                }
            }
    }
    ev.parity ^= 1;
    return swapped;
}

function updateEvents(dt, now) {
    for (let i = events.length - 1; i >= 0; i--) {
        const ev = events[i];
        if (ev.phase === 'impact') {
            if (now >= ev.impactUntil) ev.phase = 'sorting';
        } else if (ev.phase === 'sorting') {
            let anySwap = false;
            for (let k = 0; k < 2; k++) if (onePass(ev)) anySwap = true;
            ev.noSwap = anySwap ? 0 : ev.noSwap + 1;
            if (ev.noSwap >= 2) { ev.phase = 'hold'; ev.holdUntil = now + 950; }
        } else if (ev.phase === 'hold') {
            if (now >= ev.holdUntil) { ev.phase = 'remix'; ev.remix = 0; }
        } else if (ev.phase === 'remix') {
            const repl = Math.ceil(ev.w * ev.h * 0.11);
            for (let n = 0; n < repl; n++) {
                const lx = (Math.random() * ev.w) | 0, ly = (Math.random() * ev.h) | 0;
                const s = ((ev.y0 + ly) * W + (ev.x0 + lx)) * 4, d = (ly * ev.w + lx) * 4;
                ev.buf[d] = base[s]; ev.buf[d + 1] = base[s + 1]; ev.buf[d + 2] = base[s + 2];
            }
            ev.remix += dt;
            if (ev.remix >= 0.55) events.splice(i, 1);
        }
    }
}

function drawEvents() {
    const flick = ((performance.now() / 35) | 0) & 1;
    for (const ev of events) {
        const { x0, y0, w, h, buf } = ev;
        if (ev.phase === 'impact') {
            for (let ly = 0; ly < h; ly++)
                for (let lx = 0; lx < w; lx++) {
                    const d = (ly * w + lx) * 4, g = ((y0 + ly) * W + (x0 + lx)) * 4;
                    const v = ((lum(buf, d) > 120 ? 1 : 0) ^ flick) ? 236 : 18;
                    data[g] = v; data[g + 1] = v; data[g + 2] = v;
                }
            continue;
        }
        for (let ly = 0; ly < h; ly++)
            for (let lx = 0; lx < w; lx++) {
                const d = (ly * w + lx) * 4, g = ((y0 + ly) * W + (x0 + lx)) * 4;
                data[g] = buf[d]; data[g + 1] = buf[d + 1]; data[g + 2] = buf[d + 2];
            }
    }
}

function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    driftIslands(now);
    computeBase(now);
    if (now >= nextAmbient && events.length < 3) {
        const b = balls[(Math.random() * balls.length) | 0];
        const sx = 14 + (Math.random() * 18 | 0), sy = 14 + (Math.random() * 18 | 0);
        buildEvent(Math.round(b.x) - sx, Math.round(b.y) - sy, Math.round(b.x) + sx, Math.round(b.y) + sy, { impact: true, now });
        nextAmbient = now + 6000 + Math.random() * 6000;
    }
    data.set(base);
    updateEvents(dt, now);
    drawEvents();
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(frame);
}

function toCellX(px) { return Math.round(px / window.innerWidth * W); }
function toCellY(px) { return Math.round(px / window.innerHeight * H); }

window.addEventListener('mousemove', e => {
    mouse.bx = toCellX(e.clientX); mouse.by = toCellY(e.clientY);
    mouse.mx = e.clientX; mouse.my = e.clientY; mouse.inside = true;
    if (sel.active) {
        sel.cx = e.clientX; sel.cy = e.clientY;
        selBox.style.left = Math.min(sel.sx, sel.cx) + 'px'; selBox.style.top = Math.min(sel.sy, sel.cy) + 'px';
        selBox.style.width = Math.abs(sel.cx - sel.sx) + 'px'; selBox.style.height = Math.abs(sel.cy - sel.sy) + 'px';
    }
});
document.addEventListener('mouseleave', () => { mouse.inside = false; });
cv.addEventListener('mousedown', e => {
    sel.active = true; sel.sx = sel.cx = e.clientX; sel.sy = sel.cy = e.clientY;
    selBox.style.left = e.clientX + 'px'; selBox.style.top = e.clientY + 'px';
    selBox.style.width = '0px'; selBox.style.height = '0px'; selBox.style.display = 'block';
});
window.addEventListener('mouseup', () => {
    if (!sel.active) return;
    sel.active = false; selBox.style.display = 'none';
    const dx = Math.abs(sel.cx - sel.sx), dy = Math.abs(sel.cy - sel.sy);
    const axis = dy >= dx ? 'v' : 'h';
    const asc = axis === 'v' ? sel.cy > sel.sy : sel.cx > sel.sx;
    buildEvent(toCellX(Math.min(sel.sx, sel.cx)), toCellY(Math.min(sel.sy, sel.cy)),
               toCellX(Math.max(sel.sx, sel.cx)), toCellY(Math.max(sel.sy, sel.cy)), { axis, asc });
});

function makeTrackedIsland(el) {
    return { el, track: true, gspeed: 0.0002, gphase: Math.random() * 6.3, gcos: 1, gsin: 0,
             cx: 0, cy: 0, hx: 0, hy: 0, r: 0, L: 0, R: 0, T: 0, B: 0 };
}

function openBubble(idx) {
    if (isMobile) return;
    if (bubble && bubbleIdx === idx) { closeBubble(false); return; }
    closeBubble(true);
    const p = PROJECTS[idx]; if (!p) return;
    bubbleIdx = idx;
    const projRect = document.querySelectorAll('.isle')[2].getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'bubble';
    el.innerHTML =
        '<button class="bclose" aria-label="close">×</button>' +
        '<h3>' + p.title + '</h3>' +
        '<div class="btag">' + p.tags + '</div>' +
        '<div class="bphotos">' + '<div class="ph"></div>'.repeat(p.photos) + '</div>' +
        '<p>' + p.body + '</p>' +
        '<div class="blinks">' + p.links.map(function (l) { return '<a href="' + l.u + '">' + l.t + '</a>'; }).join('') + '</div>';
    document.body.appendChild(el);
    bubble = el;
    const bw = 340, bh = el.offsetHeight || 300;
    let tx = projRect.right + 120, dir = 1;
    if (tx + bw > window.innerWidth - 14) { tx = projRect.left - bw - 120; dir = -1; }
    tx = clamp(tx, 14, window.innerWidth - bw - 14);
    let ty = clamp(projRect.top + projRect.height / 2 - bh / 2, 14, window.innerHeight - bh - 14);
    el.style.left = tx + 'px'; el.style.top = ty + 'px'; el.style.transformOrigin = 'center';
    const startX = (projRect.left + projRect.right) / 2 - (tx + bw / 2);
    const startY = (projRect.top + projRect.bottom) / 2 - (ty + bh / 2);
    el.style.transform = 'translate(' + startX + 'px,' + startY + 'px) scale(0.25)';
    el.style.opacity = '0';
    el.getBoundingClientRect();
    el.style.transition = 'transform .5s cubic-bezier(.2,.85,.25,1), opacity .35s';
    el.style.transform = 'translate(0,0) scale(1)';
    el.style.opacity = '1';
    bubbleIsland = makeTrackedIsland(el);
    islands.push(bubbleIsland);
    recoilVX = -dir * 8;
    el.querySelector('.bclose').addEventListener('click', function () { closeBubble(false); });
}

function closeBubble(instant) {
    if (!bubble) return;
    const b = bubble, isl = bubbleIsland;
    bubble = null; bubbleIdx = -1;
    if (instant) {
        bubbleIsland = null;
        const i = islands.indexOf(isl); if (i >= 0) islands.splice(i, 1);
        b.remove(); return;
    }
    b.style.transition = 'transform .32s ease-in, opacity .32s';
    b.style.transform = 'scale(0.2)'; b.style.opacity = '0';
    setTimeout(function () {
        if (bubbleIsland === isl) bubbleIsland = null;
        const i = islands.indexOf(isl); if (i >= 0) islands.splice(i, 1);
        if (b.parentNode) b.remove();
    }, 340);
}

document.querySelectorAll('.pj-item').forEach(function (el) {
    el.addEventListener('click', function () { openBubble(parseInt(el.dataset.idx, 10)); });
});
window.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeBubble(false); });

document.querySelectorAll('.lng').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); if (a.dataset.l !== lang) applyLang(a.dataset.l, true); });
});

let lastVW = window.innerWidth, lastVH = window.innerHeight;
function onResize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    // On mobile the browser toolbar shows/hides while scrolling, which changes
    // innerHeight and would otherwise re-run the full (random) reinit every frame.
    // Ignore height-only changes; only real width changes / orientation flips reinit.
    if (vw < 720 && vw === lastVW && Math.abs(vh - lastVH) < 150) { lastVH = vh; return; }
    lastVW = vw; lastVH = vh;
    resize();
}
window.addEventListener('resize', onResize);
window.addEventListener('load', resize);
applyLang(lang, false);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
